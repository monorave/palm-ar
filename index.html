<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Palm AR</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100vh; height: 100dvh; background: #05070a; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #ui-video { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  #ui-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #panel {
    position: fixed; top: 14px; left: 14px; width: min(280px, calc(100vw - 28px));
    padding: 14px; border-radius: 14px;
    background: rgba(15, 18, 23, .86);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, .09);
    color: #e8edf5; font-size: 13px; line-height: 1.35;
    z-index: 10; max-height: calc(100% - 28px); overflow: auto;
    -webkit-user-select: none; user-select: none;
  }
  #panel.collapsed { display: none; }
  #panel h1 {
    margin: 0 0 10px; padding-right: 30px;
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: #9fb0c6;
  }
  #ui-collapse {
    position: absolute; top: 8px; right: 8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    color: #cdd6e1; cursor: pointer; font-size: 15px; line-height: 1; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #ui-expand {
    position: fixed; top: 14px; left: 14px;
    width: 44px; height: 44px; border-radius: 12px;
    background: rgba(15,18,23,.86);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.12);
    color: #e8edf5; cursor: pointer; font-size: 20px; z-index: 10;
    display: none; align-items: center; justify-content: center;
  }
  #ui-expand.visible { display: flex; }
  #ui-cam, #ui-switch {
    width: 100%; padding: 9px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14); font-size: 13px; font-weight: 600;
  }
  #ui-cam { background: #2f6df6; color: #fff; }
  #ui-switch { background: rgba(255,255,255,.08); color: #e8edf5; font-weight: 500; margin-top: 8px; }
  #ui-cam:active, #ui-switch:active { transform: translateY(1px); }
  #ui-cam[disabled] { opacity: .5; cursor: default; }
  .filebtn {
    display: block; margin-top: 8px; padding: 8px 10px; border-radius: 9px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); text-align: center;
  }
  #ui-file { display: none; }
  #ui-status {
    margin: 10px 0 4px; padding: 7px 9px; border-radius: 8px;
    background: rgba(255,255,255,.05); color: #b9c6d8; font-size: 12px; min-height: 30px;
  }
  #ui-status.err { background: rgba(255, 70, 70, .14); color: #ff9d9d; }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 12px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  .row span { color: #93a3b8; font-size: 12px; white-space: nowrap; }
  .row input[type=range] { width: 120px; accent-color: #2f6df6; }
  .chk { display: flex; align-items: center; gap: 8px; margin: 7px 0; cursor: pointer; }
  .chk input { accent-color: #2f6df6; }
  .hint { color: #6f7f93; font-size: 11px; margin-top: 10px; }
  @media (max-width: 480px) {
    #ui-cam, #ui-switch, .filebtn { min-height: 44px; }
    .row input[type=range] { height: 28px; }
    .chk { min-height: 32px; }
  }
</style>
</head>
<body>
<div id="stage">
  <video id="ui-video" playsinline muted autoplay></video>
  <canvas id="ui-gl"></canvas>
</div>

<div id="panel">
  <button id="ui-collapse" title="Collapse">−</button>
  <h1>Palm AR</h1>
  <button id="ui-cam">Enable camera</button>
  <button id="ui-switch" style="display:none;">Switch camera</button>
  <label class="filebtn">Load model (.glb)<input id="ui-file" type="file" accept=".glb,.gltf"></label>
  <div id="ui-status">Press "Enable camera"</div>

  <div class="row"><span>Smoothing</span><input id="ui-smooth" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="row"><span>Model size</span><input id="ui-size" type="range" min="0.3" max="2" step="0.01" value="1"></div>
  <div class="row"><span>Vertical offset</span><input id="ui-yoff" type="range" min="-1" max="1" step="0.01" value="0"></div>
  <div class="row"><span>Exposure</span><input id="ui-exp" type="range" min="0.4" max="2" step="0.01" value="1.5"></div>

  <hr>
  <label class="chk"><input id="ui-occ" type="checkbox"> Finger occlusion</label>
  <div class="row"><span>Finger width</span><input id="ui-occ-w" type="range" min="0.5" max="2" step="0.01" value="1"></div>
  <div class="row"><span>Depth bias</span><input id="ui-occ-d" type="range" min="-0.5" max="0.5" step="0.01" value="0"></div>

  <hr>
  <label class="chk"><input id="ui-points" type="checkbox"> Show hand points</label>
  <div class="hint">Tilt your hand to see the product from other sides.</div>
</div>

<button id="ui-expand" title="Show controls">☰</button>

<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<script type="importmap-shim">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module-shim">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

/* ------------------------------------------------------------------ */
/*  Config                                                             */
/* ------------------------------------------------------------------ */
const params   = new URLSearchParams(location.search);
const forceCpu = params.has('cpu');
const modelUrl = params.get('model');
const DEFAULT_MODEL = 'Solia-Wand-Pink-3d-model.glb';

const Z_GAIN = 1.2;

const $ = (id) => document.getElementById(id);
const video     = $('ui-video');
const canvas    = $('ui-gl');
const panel     = $('panel');
const statusEl  = $('ui-status');
const btnCam    = $('ui-cam');
const btnSwitch = $('ui-switch');
const btnCollapse = $('ui-collapse');
const btnExpand = $('ui-expand');
const fileInput = $('ui-file');
const smoothEl  = $('ui-smooth');
const sizeEl    = $('ui-size');
const yOffEl    = $('ui-yoff');
const expEl     = $('ui-exp');
const occEl     = $('ui-occ');
const occWEl    = $('ui-occ-w');
const occDEl    = $('ui-occ-d');
const pointsEl  = $('ui-points');

const state = {
  smoothing: 0.5,
  modelSize: 1.0,
  modelY: 0.0,
  occlusion: false,
  occWidth: 1.0,
  occDepth: 0.0,
  showPoints: false
};

/* ------------------------------------------------------------------ */
/*  One Euro Filter                                                    */
/* ------------------------------------------------------------------ */
class LowPass {
  constructor() { this.y = null; }
  filter(x, a) { this.y = (this.y === null) ? x : a * x + (1 - a) * this.y; return this.y; }
}
class OneEuro {
  constructor(minCutoff = 1.0, beta = 0.02, dCutoff = 1.0) {
    this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
    this.xf = new LowPass(); this.dxf = new LowPass();
    this.prev = null; this.prevT = null;
  }
  alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
  filter(x, t) {
    let dt = 1 / 60;
    if (this.prevT !== null) { dt = (t - this.prevT) / 1000; if (!(dt > 1e-4) || dt > 1) dt = 1 / 60; }
    this.prevT = t;
    const dx = (this.prev === null) ? 0 : (x - this.prev) / dt;
    const edx = this.dxf.filter(dx, this.alpha(this.dCutoff, dt));
    const cutoff = this.minCutoff + this.beta * Math.abs(edx);
    this.prev = x;
    return this.xf.filter(x, this.alpha(cutoff, dt));
  }
}
const filtersX = [], filtersY = [], filtersZ = [];
for (let i = 0; i < 21; i++) {
  filtersX.push(new OneEuro()); filtersY.push(new OneEuro()); filtersZ.push(new OneEuro());
}
const allFilters = [...filtersX, ...filtersY, ...filtersZ];
function applySmoothing(s) {
  const minCutoff = 6.0 * Math.pow(0.08, s);
  const beta      = 0.05 * Math.pow(0.06, s);
  for (const f of allFilters) { f.minCutoff = minCutoff; f.beta = beta; }
}
applySmoothing(state.smoothing);

/* ------------------------------------------------------------------ */
/*  Renderer / scene                                                   */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setClearColor(0x05070a, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.5;

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-640, 640, 360, -360, 10, 4000);
camera.position.set(0, 0, 1000);
camera.lookAt(0, 0, 0);

/* ------------------------------------------------------------------ */
/*  Procedural studio environment                                      */
/* ------------------------------------------------------------------ */
function buildStudioEnvironment() {
  const envScene = new THREE.Scene();

  // Gradient sky (dark, low-saturation — neutral base)
  const skyGeo = new THREE.SphereGeometry(100, 32, 32);
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: {
      topColor:    { value: new THREE.Color(0.10, 0.12, 0.16) },
      bottomColor: { value: new THREE.Color(0.02, 0.025, 0.03) }
    },
    vertexShader: `
      varying vec3 vDir;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vDir = normalize(wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 bottomColor;
      varying vec3 vDir;
      void main() {
        float h = vDir.y * 0.5 + 0.5;
        gl_FragColor = vec4(mix(bottomColor, topColor, h), 1.0);
      }
    `
  });
  envScene.add(new THREE.Mesh(skyGeo, skyMat));

  // Softbox helper — HDR colors (values >1) so PMREM captures bright light
  const addPanel = (w, h, pos, color, intensity) => {
    const m = new THREE.MeshBasicMaterial({
      color: new THREE.Color(color.r * intensity, color.g * intensity, color.b * intensity),
      side: THREE.DoubleSide
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    mesh.position.set(pos[0], pos[1], pos[2]);
    mesh.lookAt(0, 0, 0);
    envScene.add(mesh);
  };

  // Fill — cool, left (reference level)
  addPanel(50, 30, [-45, 15, 30], new THREE.Color(0.85, 0.92, 1.00), 3);
  // Fill — warm, right (mirrors left at 80% intensity — soft shadow)
  addPanel(50, 30, [45, 15, 30], new THREE.Color(0.92, 0.93, 0.97), 2.4);
  // Rim — warm, behind
  addPanel(20, 60, [-15, 20, -50], new THREE.Color(1.00, 0.90, 0.80), 4);
  // Top bounce — soft, overhead
  addPanel(80, 80, [0, 60, 0], new THREE.Color(0.90, 0.95, 1.00), 2);

  // Dark floor for subtle ground reflection
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(200, 200),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(0.05, 0.055, 0.065), side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -30;
  envScene.add(floor);

  return envScene;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromScene(buildStudioEnvironment(), 0.04).texture;

// Directional shaping — right mirrors left at 80% intensity
const fillLight = new THREE.DirectionalLight(0xbcd2ff, 0.35);
fillLight.position.set(-1.0, 0.2, 0.7);
scene.add(fillLight);
const keyLight = new THREE.DirectionalLight(0xbcd2ff, 0.28);
keyLight.position.set(1.0, 0.2, 0.7);
scene.add(keyLight);

let videoTexture = null;
let videoPlane = null;

const modelPivot = new THREE.Group();
modelPivot.visible = false;
scene.add(modelPivot);

const placeholderGroup = new THREE.Group();
{
  const geo = new THREE.CylinderGeometry(0.3, 0.3, 1.0, 32);
  const mat = new THREE.MeshStandardMaterial({ color: 0x7fb2ff, roughness: 0.35, metalness: 0.15 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = 0.5;
  placeholderGroup.add(mesh);
}
modelPivot.add(placeholderGroup);

let modelHolder = null;
let modelReady = false;

/* ------------------------------------------------------------------ */
/*  Occlusion capsules                                                 */
/* ------------------------------------------------------------------ */
const occGroup = new THREE.Group();
occGroup.visible = false;
scene.add(occGroup);
const occMat = new THREE.MeshBasicMaterial({ colorWrite: false, depthWrite: true });
const segGeo = new THREE.CylinderGeometry(1, 1, 1, 10, 1);
const sphGeo = new THREE.SphereGeometry(1, 12, 8);
const FINGER_CHAINS = [
  { chain: [1, 2, 3, 4],    r: 0.150 },
  { chain: [5, 6, 7, 8],    r: 0.110 },
  { chain: [9, 10, 11, 12], r: 0.112 },
  { chain: [13, 14, 15, 16],r: 0.105 },
  { chain: [17, 18, 19, 20],r: 0.095 }
];
const occParts = [];
for (const f of FINGER_CHAINS) {
  for (let i = 0; i < f.chain.length - 1; i++) {
    const m = new THREE.Mesh(segGeo, occMat);
    m.renderOrder = -1; m.frustumCulled = false;
    occGroup.add(m);
    occParts.push({ mesh: m, type: 'seg', a: f.chain[i], b: f.chain[i + 1], r: f.r });
  }
  for (const li of f.chain) {
    const m = new THREE.Mesh(sphGeo, occMat);
    m.renderOrder = -1; m.frustumCulled = false;
    occGroup.add(m);
    occParts.push({ mesh: m, type: 'sph', a: li, r: f.r });
  }
}

/* ------------------------------------------------------------------ */
/*  Debug points                                                       */
/* ------------------------------------------------------------------ */
const pointPositions = new Float32Array(21 * 3);
const pointsGeo = new THREE.BufferGeometry();
pointsGeo.setAttribute('position', new THREE.BufferAttribute(pointPositions, 3));
const pointsMat = new THREE.PointsMaterial({
  color: 0x59b0ff, size: 7, sizeAttenuation: false,
  depthTest: false, transparent: true
});
const pointsObj = new THREE.Points(pointsGeo, pointsMat);
pointsObj.renderOrder = 10; pointsObj.frustumCulled = false; pointsObj.visible = false;
scene.add(pointsObj);

/* ------------------------------------------------------------------ */
/*  Status                                                             */
/* ------------------------------------------------------------------ */
let lastStatus = '';
function setStatus(text, isError = false) {
  if (text === lastStatus) return;
  lastStatus = text;
  statusEl.textContent = text;
  statusEl.classList.toggle('err', !!isError);
}

/* ------------------------------------------------------------------ */
/*  Camera                                                             */
/* ------------------------------------------------------------------ */
let currentFacingMode = 'user';
let currentStream = null;
let cameraCount = 1;
let rafStarted = false;

function resize() {
  const cw = canvas.clientWidth || window.innerWidth;
  const ch = canvas.clientHeight || window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(cw, ch, false);
  const W = video.videoWidth  || 1280;
  const H = video.videoHeight || 720;
  const vAspect = W / H, cAspect = cw / ch;
  let viewW, viewH;
  if (cAspect > vAspect) { viewH = H; viewW = H * cAspect; }
  else                   { viewW = W; viewH = W / cAspect; }
  camera.left = -viewW / 2; camera.right = viewW / 2;
  camera.top = viewH / 2;   camera.bottom = -viewH / 2;
  camera.updateProjectionMatrix();
}

function setupVideoPlane() {
  if (videoPlane) {
    scene.remove(videoPlane);
    if (videoPlane.material.map) videoPlane.material.map.dispose();
    videoPlane.geometry.dispose(); videoPlane.material.dispose();
    videoPlane = null; videoTexture = null;
  }
  const W = video.videoWidth  || 1280;
  const H = video.videoHeight || 720;
  videoTexture = new THREE.VideoTexture(video);
  videoTexture.colorSpace = THREE.SRGBColorSpace;
  videoTexture.minFilter = THREE.LinearFilter;
  videoTexture.magFilter = THREE.LinearFilter;
  videoPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(W, H),
    new THREE.MeshBasicMaterial({ map: videoTexture, depthWrite: false, toneMapped: false })
  );
  videoPlane.scale.x = (currentFacingMode === 'user') ? -1 : 1;
  videoPlane.position.z = -600;
  videoPlane.renderOrder = -10;
  scene.add(videoPlane);
}

async function openStream(facingMode) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('Camera API unavailable - page must be over HTTPS or on localhost');
  }
  const attempts = [
    { audio: false, video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { audio: false, video: { facingMode } },
    { audio: false, video: true }
  ];
  let stream = null, lastErr = null;
  for (const c of attempts) {
    try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
    catch (e) { lastErr = e; if (e && e.name && e.name !== 'OverconstrainedError') throw e; }
  }
  if (!stream) throw lastErr || new Error('Could not open camera');
  currentStream = stream;
  video.srcObject = stream;
  try { await video.play(); } catch (e) { console.warn('video.play() rejected', e); }
  if (!video.videoWidth) {
    await new Promise((res, rej) => {
      const t0 = performance.now();
      const iv = setInterval(() => {
        if (video.videoWidth) { clearInterval(iv); res(); }
        else if (performance.now() - t0 > 8000) { clearInterval(iv); rej(new Error('No frames from camera')); }
      }, 50);
    });
  }
}

async function checkCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraCount = devices.filter(d => d.kind === 'videoinput').length;
  } catch (e) { cameraCount = 1; }
  btnSwitch.style.display = cameraCount > 1 ? 'block' : 'none';
}

async function startCamera(facingMode = 'user') {
  currentFacingMode = facingMode;
  await openStream(facingMode);
  setupVideoPlane(); resize();
  window.addEventListener('resize', resize);
  if (!rafStarted) { rafStarted = true; requestAnimationFrame(animate); }
  checkCameras();
}

async function switchCamera() {
  if (cameraCount < 2) return;
  btnSwitch.disabled = true;
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  await new Promise(r => setTimeout(r, 200));
  const newFacing = currentFacingMode === 'user' ? 'environment' : 'user';
  try {
    currentFacingMode = newFacing;
    await openStream(newFacing);
    setupVideoPlane(); resize();
    lastVideoTime = -1;
    setStatus('Camera switched');
  } catch (e) {
    console.error('switch camera:', e);
    setStatus('Switch failed: ' + describeCameraError(e), true);
    try {
      currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
      await openStream(currentFacingMode); setupVideoPlane(); resize();
    } catch (e2) { console.error('restore failed:', e2); }
  } finally { btnSwitch.disabled = false; }
}

/* ------------------------------------------------------------------ */
/*  Hand tracker                                                       */
/* ------------------------------------------------------------------ */
let landmarker = null;
async function initLandmarker() {
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );
  const base = { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' };
  const common = { baseOptions: base, runningMode: 'VIDEO', numHands: 1 };
  if (forceCpu) {
    landmarker = await HandLandmarker.createFromOptions(fileset, { ...common, baseOptions: { ...base, delegate: 'CPU' } });
    console.log('HandLandmarker ready - CPU (forced)');
    return;
  }
  try {
    landmarker = await HandLandmarker.createFromOptions(fileset, { ...common, baseOptions: { ...base, delegate: 'GPU' } });
    console.log('HandLandmarker ready - GPU');
  } catch (e) {
    console.warn('GPU delegate failed, falling back to CPU', e);
    landmarker = await HandLandmarker.createFromOptions(fileset, { ...common, baseOptions: { ...base, delegate: 'CPU' } });
    console.log('HandLandmarker ready - CPU (fallback)');
  }
}

/* ------------------------------------------------------------------ */
/*  Model loading                                                      */
/* ------------------------------------------------------------------ */
function disposeObject(obj) {
  obj.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
        m.dispose();
      }
    }
  });
}

// Pre-compile shaders for the real model, off-screen, so its first
// appearance doesn't hitch on shader compilation.
async function precompileModel() {
  if (!modelHolder) return;
  const wasVisible = modelPivot.visible;
  const wasPos = modelPivot.position.clone();
  modelPivot.visible = true;
  modelPivot.position.set(1e6, 1e6, 0);
  try {
    if (typeof renderer.compileAsync === 'function') {
      await renderer.compileAsync(scene, camera);
    } else {
      renderer.compile(scene, camera);
    }
  } catch (e) {
    console.warn('precompile failed', e);
  } finally {
    modelPivot.position.copy(wasPos);
    if (!handVisible) modelPivot.visible = wasVisible;
    modelReady = true;
  }
}

function setModel(sourceObject) {
  if (modelHolder) {
    modelPivot.remove(modelHolder);
    disposeObject(modelHolder);
    modelHolder = null;
  }
  modelReady = false;

  const holder = new THREE.Group();
  holder.add(sourceObject);
  holder.updateWorldMatrix(true, true);

  let box = new THREE.Box3().setFromObject(holder);
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  holder.scale.setScalar(1 / maxDim);
  holder.updateWorldMatrix(true, true);

  box = new THREE.Box3().setFromObject(holder);
  const c = box.getCenter(new THREE.Vector3());
  holder.position.set(-c.x, -box.min.y, -c.z);

  modelHolder = holder;
  modelPivot.add(holder);
  placeholderGroup.visible = false;
  setStatus('Model loaded');

  // Kick off shader pre-compilation in the background.
  precompileModel();
}

function loadModelFromUrl(url, silent = false) {
  if (!silent) setStatus('Loading model...');
  new GLTFLoader().load(
    url,
    (gltf) => setModel(gltf.scene),
    (ev) => {
      if (ev.lengthComputable && ev.total && !silent) {
        const pct = Math.round((ev.loaded / ev.total) * 100);
        setStatus('Loading model ' + pct + '%');
      }
    },
    (err) => {
      console.warn('Model load failed:', url, err);
      if (!silent) setStatus('Error: failed to load model', true);
    }
  );
}

function loadModelFromFile(file) {
  const url = URL.createObjectURL(file);
  new GLTFLoader().load(
    url,
    (gltf) => { setModel(gltf.scene); URL.revokeObjectURL(url); },
    undefined,
    (err) => {
      console.error(err);
      setStatus('Error: failed to load model', true);
      URL.revokeObjectURL(url);
    }
  );
}

/* ------------------------------------------------------------------ */
/*  Per-frame hand processing                                          */
/* ------------------------------------------------------------------ */
const handPts = [];
for (let i = 0; i < 21; i++) handPts.push(new THREE.Vector3());

const _A = new THREE.Vector3(), _B = new THREE.Vector3(), _M = new THREE.Vector3(), _D = new THREE.Vector3();
const _Y = new THREE.Vector3(0, 1, 0);
const _up = new THREE.Vector3(), _fwd = new THREE.Vector3(), _right = new THREE.Vector3();
const _mat4 = new THREE.Matrix4(), _targetQuat = new THREE.Quaternion();
const _palmCenter = new THREE.Vector3();
const _vecA = new THREE.Vector3(), _vecB = new THREE.Vector3(), _palmNormal = new THREE.Vector3();

let handVisible = false;
let palmTowardCamera = true;
let palmInitialized = false;
let palmFlipFrames = 0;
const PALM_FLIP_THRESHOLD = 4;

function hideHand() {
  if (!handVisible) return;
  handVisible = false;
  palmInitialized = false; palmFlipFrames = 0;
  modelPivot.visible = false;
  occGroup.visible = false;
  pointsObj.visible = false;
  setStatus('Show your palm');
}

function updatePalmState(lms, handedness) {
  if (!handedness) return;
  const c = (lms[5].x - lms[0].x) * (lms[17].y - lms[0].y) -
            (lms[5].y - lms[0].y) * (lms[17].x - lms[0].x);
  const isRight = handedness === 'Right';
  const newPalm = (isRight && c < 0) || (!isRight && c > 0);
  if (!palmInitialized) { palmTowardCamera = newPalm; palmInitialized = true; palmFlipFrames = 0; return; }
  if (newPalm !== palmTowardCamera) {
    palmFlipFrames++;
    if (palmFlipFrames >= PALM_FLIP_THRESHOLD) { palmTowardCamera = newPalm; palmFlipFrames = 0; }
  } else { palmFlipFrames = 0; }
}

function onResults(results, now) {
  const lms = results.landmarks && results.landmarks[0];
  if (!lms) { hideHand(); return; }

  const W = video.videoWidth, H = video.videoHeight;
  const mirrored = currentFacingMode === 'user';
  const handedness = results.handednesses?.[0]?.[0]?.categoryName;
  updatePalmState(lms, handedness);

  for (let i = 0; i < 21; i++) {
    const l = lms[i];
    const x = (mirrored ? (0.5 - l.x) : (l.x - 0.5)) * W;
    const y = (0.5 - l.y) * H;
    const z = -l.z * W * Z_GAIN;
    handPts[i].set(
      filtersX[i].filter(x, now),
      filtersY[i].filter(y, now),
      filtersZ[i].filter(z, now)
    );
  }

  _palmCenter.set(0, 0, 0);
  for (const i of [0, 5, 9, 13, 17]) _palmCenter.add(handPts[i]);
  _palmCenter.multiplyScalar(1 / 5);

  const palmLen = Math.hypot(handPts[9].x - handPts[0].x, handPts[9].y - handPts[0].y) || 1;
  const palmWidth = Math.hypot(handPts[5].x - handPts[17].x, handPts[5].y - handPts[17].y) || 1;

  _up.set(handPts[9].x - handPts[0].x, handPts[9].y - handPts[0].y, handPts[9].z - handPts[0].z);
  if (_up.lengthSq() < 1e-6) _up.set(0, 1, 0);
  _up.normalize();

  _vecA.copy(handPts[5]).sub(handPts[0]);
  _vecB.copy(handPts[17]).sub(handPts[0]);
  _palmNormal.crossVectors(_vecA, _vecB);
  if (_palmNormal.lengthSq() < 1e-6) _palmNormal.set(0, 0, 1);
  _palmNormal.normalize();
  if (palmTowardCamera && _palmNormal.z < 0) _palmNormal.negate();
  if (!palmTowardCamera && _palmNormal.z > 0) _palmNormal.negate();

  _fwd.copy(_palmNormal).addScaledVector(_up, -_palmNormal.dot(_up));
  if (_fwd.lengthSq() < 1e-4) _fwd.set(0, 0, 1);
  _fwd.normalize();
  _right.crossVectors(_up, _fwd).normalize();

  _mat4.makeBasis(_right, _up, _fwd);
  _targetQuat.setFromRotationMatrix(_mat4);

  modelPivot.visible = modelReady;
  modelPivot.position.copy(_palmCenter);
  modelPivot.position.y += palmLen * state.modelY;
  modelPivot.scale.setScalar(palmLen * state.modelSize);
  if (modelPivot.quaternion.dot(_targetQuat) < 0) {
    _targetQuat.set(-_targetQuat.x, -_targetQuat.y, -_targetQuat.z, -_targetQuat.w);
  }
  modelPivot.quaternion.slerp(_targetQuat, 0.45);

  const depthBias = state.occDepth * palmLen;
  if (state.occlusion && modelPivot.visible) {
    occGroup.visible = true;
    for (const p of occParts) {
      const r = p.r * palmWidth * state.occWidth;
      if (p.type === 'sph') {
        _A.copy(handPts[p.a]); _A.z += depthBias;
        p.mesh.position.copy(_A); p.mesh.scale.setScalar(r);
      } else {
        _A.copy(handPts[p.a]); _A.z += depthBias;
        _B.copy(handPts[p.b]); _B.z += depthBias;
        _D.subVectors(_B, _A);
        const len = _D.length();
        if (len < 1e-4) { p.mesh.visible = false; continue; }
        p.mesh.visible = true;
        _M.addVectors(_A, _B).multiplyScalar(0.5);
        p.mesh.position.copy(_M);
        p.mesh.quaternion.setFromUnitVectors(_Y, _D.normalize());
        p.mesh.scale.set(r, len, r);
      }
    }
  } else {
    occGroup.visible = false;
  }

  pointsObj.visible = state.showPoints;
  if (state.showPoints) {
    for (let i = 0; i < 21; i++) {
      pointPositions[i * 3 + 0] = handPts[i].x;
      pointPositions[i * 3 + 1] = handPts[i].y;
      pointPositions[i * 3 + 2] = handPts[i].z + depthBias + 1;
    }
    pointsGeo.attributes.position.needsUpdate = true;
  }

  if (!handVisible) { handVisible = true; setStatus('Hand found'); }
}

/* ------------------------------------------------------------------ */
/*  Loop                                                               */
/* ------------------------------------------------------------------ */
let lastVideoTime = -1;
function animate(now) {
  requestAnimationFrame(animate);
  if (videoTexture && video.readyState >= 2) videoTexture.needsUpdate = true;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    try { onResults(landmarker.detectForVideo(video, now), now); }
    catch (e) { console.warn('detectForVideo failed', e); }
  }
  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ */
/*  UI wiring                                                          */
/* ------------------------------------------------------------------ */
function describeCameraError(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError')      return 'Camera permission denied - check system and site settings, reload';
  if (n === 'NotFoundError')        return 'No camera found on this device';
  if (n === 'NotReadableError')     return 'Camera is busy - close other tabs/apps using it';
  if (n === 'OverconstrainedError') return 'Camera does not support the requested settings';
  if (n === 'SecurityError')        return 'Camera blocked - page must be served over HTTPS';
  return e && e.message ? e.message : String(e);
}

btnCam.addEventListener('click', async () => {
  btnCam.disabled = true;
  setStatus('Starting camera...');
  try { await startCamera('user'); }
  catch (e) {
    console.error('camera:', e);
    setStatus('Camera: ' + describeCameraError(e), true);
    btnCam.disabled = false; return;
  }
  try {
    setStatus('Loading hand tracker...');
    await initLandmarker();
  } catch (e) {
    console.error('tracker:', e);
    setStatus('Tracker: ' + describeCameraError(e), true);
    btnCam.disabled = false; return;
  }
  btnCam.style.display = 'none';
  setStatus('Show your palm');
});

btnSwitch.addEventListener('click', switchCamera);
fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) loadModelFromFile(f);
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadModelFromFile(f);
});

smoothEl.addEventListener('input', () => { state.smoothing = parseFloat(smoothEl.value); applySmoothing(state.smoothing); });
sizeEl.addEventListener('input', () => { state.modelSize = parseFloat(sizeEl.value); });
yOffEl.addEventListener('input', () => { state.modelY = parseFloat(yOffEl.value); });
expEl.addEventListener('input', () => { renderer.toneMappingExposure = parseFloat(expEl.value); });
occEl.addEventListener('change', () => { state.occlusion = occEl.checked; });
occWEl.addEventListener('input', () => { state.occWidth = parseFloat(occWEl.value); });
occDEl.addEventListener('input', () => { state.occDepth = parseFloat(occDEl.value); });
pointsEl.addEventListener('change', () => { state.showPoints = pointsEl.checked; });

function setCollapsed(c) {
  if (c) { panel.classList.add('collapsed'); btnExpand.classList.add('visible'); }
  else { panel.classList.remove('collapsed'); btnExpand.classList.remove('visible'); }
  try { localStorage.setItem('palm-ar-collapsed', c ? '1' : '0'); } catch (e) {}
}
btnCollapse.addEventListener('click', () => setCollapsed(true));
btnExpand.addEventListener('click', () => setCollapsed(false));
try { setCollapsed(localStorage.getItem('palm-ar-collapsed') === '1'); } catch (e) { setCollapsed(false); }

/* Kick off model preload (parallel with camera permission UI) */
loadModelFromUrl(modelUrl || DEFAULT_MODEL, true);

resize();
</script>
</body>
